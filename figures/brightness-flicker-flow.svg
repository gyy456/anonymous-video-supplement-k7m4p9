   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b31" x="12.96" y="20.25668" transform="rotate(-0 12.96 20.25668)">A possible source of brightness flicker</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294637" x="27.36" y="67.405" transform="rotate(-0 27.36 67.405)">1  Input panoramas</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(27.36 105.194937)">Exposure / illumination may differ</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(27.36 121.094937)">between capture viewpoints.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294637" x="347.04" y="67.4055" transform="rotate(-0 347.04 67.4055)">2  Segment-wise generation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(347.04 105.194937)">A long path is generated in segments,</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(347.04 121.094937)">which can differ in overall brightness.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294637" x="666.72" y="67.4055" transform="rotate(-0 666.72 67.4055)">3  Segment transition</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(666.72 105.194937)">Joining the segments may reveal</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #55645c" transform="translate(666.72 121.094937)">a brief brightness change.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #36503e" x="380.52" y="158.577891" transform="rotate(-0 380.52 158.577891)">S1</text>
   </g>
   <g id="text_9">
